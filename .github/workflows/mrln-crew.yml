name: MRLN crew and design checks
on:
  pull_request:
    paths:
      - 'frontend/app/mrln-crew-art.js'
      - 'frontend/app/mrln-materials.js'
      - 'frontend/app/mrln-sky.js'
      - 'frontend/app/spacebg.js'
      - 'frontend/app/backdrop-bake-worker.js'
      - 'test/mrln-sky.test.js'
      - 'frontend/app/industrialtextures.js'
      - 'test/mrln-materials.test.js'
      - 'test/datareset.test.js'
      - 'frontend/app/datareset.js'
      - 'src-tauri/src/erase_all.rs'
      - 'frontend/app/skinstage.js'
      - 'frontend/app/agentportraits.js'
      - 'frontend/js/assets.js'
      - 'frontend/app/stationtemplates.js'
      - 'frontend/index.html'
      - 'frontend/app/app.js'
      - 'frontend/app/updates.js'
      - 'test/update-state-parity.test.js'
      - 'test/mrln-brand-integration.test.js'
      - 'test/mrln-distribution-gate.test.js'
      - 'test/mrln-product-claims.test.js'
      - 'scripts/mrln-release-assets.mjs'
      - 'test/qa-product-perfect-claims.test.js'
      - 'test/t5-public-distribution.test.js'
      - 'test/mrln-crew-art.test.js'
      - '.github/workflows/mrln-crew.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crew-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify six crews and every animation track
        run: |
          node test/mrln-crew-art.test.js
          node test/mrln-materials.test.js
          node test/mrln-sky.test.js
          node test/mrln-brand-integration.test.js
          node test/mrln-distribution-gate.test.js
          node test/mrln-product-claims.test.js
          node test/datareset.test.js
      - name: Inherited media audit (internal report, public release remains blocked)
        run: node scripts/mrln-release-assets.mjs

      - name: Upload rights-clearance inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrln-media-clearance-report
          path: .mrln-audit/assets.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: JavaScript syntax
        run: |
          node --check scripts/mrln-release-assets.mjs
          node --check test/mrln-distribution-gate.test.js
          node --check test/mrln-product-claims.test.js
          node --check frontend/app/mrln-crew-art.js
          node --check frontend/app/mrln-materials.js
          node --check frontend/app/mrln-sky.js
          node --check frontend/app/spacebg.js
          node --check frontend/app/backdrop-bake-worker.js
          node --check frontend/app/industrialtextures.js
          node --check frontend/js/assets.js
          node --check frontend/app/skinstage.js
          node --check frontend/app/agentportraits.js
          node --check frontend/app/app.js
          node --check frontend/app/updates.js
          node --check frontend/app/stationtemplates.js
