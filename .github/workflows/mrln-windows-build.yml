name: MRLN Windows internal test installer

on:
  push:
    branches: [feature/mrln-animated-crew, feature/mrln-safe-reset-copy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrln-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: mrln-win-x64

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate generated MRLN art
        run: |
          node test/mrln-crew-art.test.js
          node test/mrln-materials.test.js
          node --check scripts/mrln-stage-windows.mjs

      - name: Stage independent MRLN identity and installer art
        run: node scripts/mrln-stage-windows.mjs

      - name: Check update isolation
        shell: pwsh
        run: |
          $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($c.productName -ne 'MRLN Agent Station' -or $c.identifier -ne 'com.mrln.agentstation') { throw 'Incorrect product identity' }
          if ($c.bundle.createUpdaterArtifacts -or @($c.plugins.updater.endpoints).Count -gt 0) { throw 'Upstream update feed still enabled' }

      - name: Stage bundled Node runtime and voice dependencies
        run: |
          node scripts/prepare-node.mjs win-x64
          node scripts/stage-voice-deps.mjs --target win-x64
          node scripts/stage-frontend-dist.mjs

      - name: Build Windows installer (unsigned internal test only)
        run: npm run tauri -- build --bundles nsis

      - name: Install and launch the MRLN Windows executable
        shell: pwsh
        run: ./scripts/mrln-windows-installed-smoke.ps1

      - name: Upload installed launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrln-windows-installed-smoke-${{ github.run_number }}
          path: mrln-installed-smoke.json
          if-no-files-found: warn

      - name: Upload internal test installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mrln-windows-internal-test-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
